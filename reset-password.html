<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>استعادة كلمة مرور بيوكير</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f7f5;color:#102d27;font-family:Tahoma,Arial,sans-serif;padding:18px}
.card{width:min(560px,100%);background:#fff;border:1px solid #d9e5e1;border-radius:24px;padding:32px;box-shadow:0 18px 50px #173c3020}
h1{margin:0 0 8px;font-size:30px}p{color:#60736d;line-height:1.8}
label{display:block;font-weight:700;margin:20px 0 8px}input{width:100%;border:2px solid #d4e1dd;border-radius:14px;padding:15px;font-size:18px;direction:ltr}
button,a.btn{display:block;width:100%;margin-top:22px;border:0;border-radius:14px;padding:15px;text-align:center;font-size:19px;font-weight:700;text-decoration:none}
button{background:#3f876f;color:#fff}.btn{background:#edf5f2;color:#245b4a}.msg{display:none;margin-top:18px;padding:14px;border-radius:12px}.ok{background:#e8f7ef;color:#17673f}.err{background:#fff0ee;color:#9c2b20}
small{display:block;margin-top:10px;color:#72857f}
</style>
</head>
<body>
<main class="card">
<h1>إنشاء كلمة مرور جديدة</h1>
<p>أدخل كلمة مرور جديدة لحساب بيوكير. يجب فتح هذه الصفحة من رابط الاستعادة المرسل إلى بريدك.</p>
<form id="form">
<label for="password">كلمة المرور الجديدة</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">تأكيد كلمة المرور</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<small>استخدم 8 أحرف على الأقل، ويفضّل الجمع بين الحروف والأرقام والرموز.</small>
<button id="submit" type="submit">حفظ كلمة المرور</button>
</form>
<div id="msg" class="msg"></div>
<a id="login" class="btn" href="./app.html" hidden>العودة إلى تسجيل الدخول</a>
</main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://jlibhpavbqfeegsehekm.supabase.co","sb_publishable_XVOmCPOiqdUlG-pOPhrQ0g_rIV0R6tK",{auth:{detectSessionInUrl:true,persistSession:true}});
const form=document.getElementById("form"),msg=document.getElementById("msg"),login=document.getElementById("login"),submit=document.getElementById("submit");
function show(text,type="err"){msg.textContent=text;msg.className="msg "+type;msg.style.display="block"}
const code=new URLSearchParams(location.search).get("code");
if(code){const {error}=await supabase.auth.exchangeCodeForSession(code);if(error)show("رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا.");}
const {data:{session}}=await supabase.auth.getSession();
if(!session)show("بانتظار التحقق من رابط الاستعادة. افتح الرابط المرسل إلى بريدك الإلكتروني.");
form.addEventListener("submit",async(e)=>{
 e.preventDefault();msg.style.display="none";
 const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
 if(password.length<8)return show("كلمة المرور يجب ألا تقل عن 8 أحرف.");
 if(password!==confirm)return show("كلمتا المرور غير متطابقتين.");
 submit.disabled=true;submit.textContent="جارٍ الحفظ…";
 const {error}=await supabase.auth.updateUser({password});
 if(error){submit.disabled=false;submit.textContent="حفظ كلمة المرور";return show("تعذر حفظ كلمة المرور. افتح أحدث رابط استعادة وحاول مجددًا.");}
 show("تم تحديث كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.","ok");form.hidden=true;login.hidden=false;
});
</script>
</body></html>
