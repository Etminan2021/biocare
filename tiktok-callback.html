<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>TikTok Authorization | Biocare</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f8f6;color:#163c2e;margin:0;display:grid;place-items:center;min-height:100vh}
.card{max-width:560px;margin:24px;background:#fff;border:1px solid #dce8e1;border-radius:20px;padding:28px;box-shadow:0 14px 42px rgba(20,72,53,.08)}
h1{margin-top:0}p{color:#5b6f66;line-height:1.7}
</style>
</head>
<body>
<div class="card">
<h1>TikTok Authorization</h1>
<p id="status">Securely completing the Biocare TikTok authorization…</p>
<p>Please keep this page open until the process finishes.</p>
</div>
<script>
(function(){
  var qs=location.search||'';
  var target='https://biocare-lis-staging.wild-butterfly-9d21.workers.dev/api/v1/integrations/tiktok/accounts/oauth/callback'+qs;
  if(!qs){
    document.getElementById('status').textContent='No TikTok authorization response was received.';
    return;
  }
  location.replace(target);
})();
</script>
</body>
</html>
