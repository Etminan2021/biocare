<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Biocare">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>مختبرات بيوكير الطبية | Biocare</title>
</head>
<body>
<div id="splash" class="splash">
  <img src="logo-full.png" alt="Biocare">
</div>

<header class="app-header">
  <div class="header-actions">
    <button class="icon-btn" id="notifyBtn" aria-label="الإشعارات">🔔<span class="dot"></span></button>
    <button class="icon-btn" id="cartBtn" aria-label="السلة">🛒</button>
  </div>
  <img class="header-logo" src="logo-full.png" alt="مختبرات بيوكير الطبية">
  <button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
</header>

<main id="app"></main>

<nav class="bottom-nav">
  <button data-view="home" class="nav-item active"><span>⌂</span><b>الرئيسية</b></button>
  <button data-view="packages" class="nav-item"><span>🎁</span><b>الباقات</b></button>
  <button data-view="booking" class="nav-item booking-fab"><span>📅</span></button>
  <button data-view="results" class="nav-item"><span>▤</span><b>النتائج</b></button>
  <button data-view="profile" class="nav-item"><span>👤</span><b>حسابي</b></button>
</nav>

<div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <img src="logo-full.png" alt="Biocare">
    <button id="drawerClose">✕</button>
  </div>
  <div class="drawer-scroll" id="drawerMenu"></div>
</aside>

<div class="modal hidden" id="modal">
 <div class="sheet">
  <button id="modalClose" class="sheet-close">✕</button>
  <div id="modalBody"></div>
 </div>
</div>

<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body></html>
