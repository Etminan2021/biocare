<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Biocare">
<meta name="description" content="مختبرات بيوكير الطبية - التحاليل والباقات والحجز والنتائج والاستشارات">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>مختبرات بيوكير الطبية | Biocare</title>
</head>
<body>
<div id="splash" class="splash"><img src="logo-full.png" alt="مختبرات بيوكير الطبية"></div>

<header class="app-header">
  <div class="header-actions">
    <button class="icon-btn" id="notifyBtn" aria-label="الإشعارات">♧<span class="dot"></span></button>
    <button class="icon-btn" id="cartBtn" aria-label="السلة">▱<span id="cartCount" class="cart-count hidden">0</span></button>
  </div>
  <img class="header-logo" src="logo-full.png" alt="مختبرات بيوكير الطبية">
  <button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
</header>

<main id="app"></main>

<nav class="bottom-nav" aria-label="التنقل الرئيسي">
  <button data-view="home" class="nav-item active"><span>⌂</span><b>الرئيسية</b></button>
  <button data-view="packages" class="nav-item"><span>◇</span><b>الباقات</b></button>
  <button data-view="booking" class="nav-item booking-fab" aria-label="الحجز"><span>▣</span></button>
  <button data-view="results" class="nav-item"><span>▤</span><b>النتائج</b></button>
  <button data-view="profile" class="nav-item"><span>○</span><b>حسابي</b></button>
</nav>

<div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <img src="logo-full.png" alt="Biocare">
    <button id="drawerClose" aria-label="إغلاق">✕</button>
  </div>
  <div class="drawer-scroll" id="drawerMenu"></div>
</aside>

<div class="modal hidden" id="modal">
 <div class="sheet">
  <button id="modalClose" class="sheet-close" aria-label="إغلاق">✕</button>
  <div id="modalBody"></div>
 </div>
</div>

<script src="catalog.js"></script>
<script>
window.BIOCARE_CATALOG_READY.then(()=>{const s=document.createElement("script");s.src="app.js?v=4";document.body.appendChild(s)}).catch(e=>{console.error(e);document.getElementById("app").innerHTML="<div style=\"padding:24px\">تعذر تحميل بيانات التطبيق. حدّث الصفحة.</div>"});
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body></html>
