<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Biocare">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="description" content="مختبرات بيوكير الطبية - التحاليل والباقات والحجز والنتائج والاستشارات">
<link rel="stylesheet" href="styles.css">
<title>مختبرات بيوكير الطبية | Biocare</title>
</head>
<body>
<div id="splash" class="splash"><img src="logo-full.png" alt="مختبرات بيوكير الطبية"></div>
<header class="app-header">
  <div class="header-actions">
    <button class="icon-btn" id="notifyBtn" aria-label="الإشعارات"><svg class="header-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="dot"></span></button>
    <button class="icon-btn" id="cartBtn" aria-label="السلة"><svg class="header-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.5 11h10l2-8H6"/><circle cx="10" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg><span id="cartCount" class="cart-count hidden">0</span></button>
  </div>
  <img class="header-logo" src="logo-full.png" alt="مختبرات بيوكير الطبية">
  <button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
</header>
<main id="app"></main>
<button class="instant-chat-btn" type="button" onclick="openInstantChat()" aria-label="المحادثة الفورية" title="المحادثة الفورية">
  <span class="instant-chat-dot" aria-hidden="true"></span>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-8.4 8A9.6 9.6 0 0 1 8 18.7L4 20l1.3-3.5A8 8 0 1 1 20 11.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 11.7h7M8.5 8.7h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <span class="instant-chat-label">محادثة فورية</span>
</button>
<nav class="bottom-nav" aria-label="التنقل الرئيسي">
  <button data-view="home" class="nav-item active"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 3l9 8v9H5v-9"/><path d="M9 20v-6h6v6"/></svg></span><b>الرئيسية</b></button>
  <button data-view="packages" class="nav-item"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v13H4z"/><path d="M8 7V4h8v3M4 11h16"/></svg></span><b>الباقات</b></button>
  <button data-view="booking" class="nav-item booking-fab" aria-label="الحجز"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 5h14v14H5z"/><path d="M8 12h8M12 8v8"/></svg></span></button>
  <button data-view="results" class="nav-item"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><b>النتائج</b></button>
  <button data-view="profile" class="nav-item"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg></span><b>حسابي</b></button>
</nav>
<div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-head"><img src="logo-full.png" alt="Biocare"><button id="drawerClose" aria-label="إغلاق">✕</button></div><div class="drawer-scroll" id="drawerMenu"></div></aside>
<div class="modal hidden" id="modal"><div class="sheet"><button id="modalClose" class="sheet-close" aria-label="إغلاق">✕</button><div id="modalBody"></div></div></div>
<script src="catalog.js?v=9"></script>
<script>
window.BIOCARE_CATALOG_READY.then(()=>{
  const s=document.createElement("script");
  s.src="app.js?v=9";
  s.onload=()=>{
    const p=document.createElement("script");
    p.src="profile.js?v=2";
    p.onload=()=>{
      const a=document.createElement("script");
      a.src="saleem.js?v=1";
      a.onload=()=>{
        const x=document.createElement("script");
        x.src="services.js?v=1";
        x.onload=()=>{const cloud=document.createElement("script");cloud.src="biocare-cloud.js?v=3";cloud.onload=()=>{const geo=document.createElement("script");geo.src="biocare-location.js?v=2";geo.onload=()=>{const live=document.createElement("script");live.src="biocare-team-provider.js?v=1";live.onload=()=>{const cms=document.createElement("script");cms.src="biocare-cms.js?v=22";document.body.appendChild(cms)};document.body.appendChild(live)};document.body.appendChild(geo)};document.body.appendChild(cloud)};
        document.body.appendChild(x);
      };
      document.body.appendChild(a);
    };
    document.body.appendChild(p);
  };
  document.body.appendChild(s);
}).catch(e=>{console.error(e);document.getElementById("app").innerHTML="<div style=\"padding:24px\">تعذر تحميل بيانات التطبيق. حدّث الصفحة.</div>"});
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body></html>
