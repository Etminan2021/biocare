name: Send Biocare admin password recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/send-admin-password-recovery.yml
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the password recovery email
        env:
          SUPABASE_URL: https://jlibhpavbqfeegsehekm.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_XVOmCPOiqdUlG-pOPhrQ0g_rIV0R6tK
          ADMIN_EMAIL: admin@biocaredx.com
          REDIRECT_URL: https://etminan2021.github.io/biocare/
          RECOVERY_REDIRECT_VERSION: recovery-router-v2
        run: |
          set -euo pipefail
          payload="$(jq -n --arg email "$ADMIN_EMAIL" '{email:$email}')"
          code="$(curl -sS -o /tmp/recovery.json -w '%{http_code}'             -X POST -H "apikey: $SUPABASE_PUBLISHABLE_KEY"             -H 'content-type: application/json'             --data "$payload"             "$SUPABASE_URL/auth/v1/recover?redirect_to=$(printf '%s' "$REDIRECT_URL" | jq -sRr @uri)")"
          test "$code" = "200"
          echo "Password recovery email accepted by Supabase Auth."
