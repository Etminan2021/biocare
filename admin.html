<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#155b3f">
<title>بيوكير | لوحة التحكم</title>
<style>
:root{--g:#155b3f;--g2:#0e4632;--r:#c6282e;--bg:#f5f8f6;--line:#dce8e1;--muted:#6b7a72}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"SF Arabic","Segoe UI",Arial;color:#153a2c}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px}
header img{height:46px;max-width:190px;object-fit:contain}header a{color:var(--g);text-decoration:none;font-weight:800}
main{max-width:1180px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
h1,h2,h3{margin-top:0}.muted{color:var(--muted);line-height:1.65}.notice{background:#fff8e7;border:1px solid #eedcaf;border-radius:14px;padding:12px}
input,select,textarea{width:100%;border:1px solid #cbdcd2;border-radius:11px;padding:11px;background:#fff;margin:5px 0 10px}
button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;background:var(--g);color:#fff}.secondary{background:#eaf3ee;color:var(--g)}.danger{background:#fff0f0;color:#a6282d;border:1px solid #f0c6c8}.ghost{background:#fff;color:var(--g);border:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow:auto;padding:7px 0 4px;position:sticky;top:72px;background:var(--bg);z-index:8}.tabs button{white-space:nowrap;background:#fff;color:var(--g);border:1px solid var(--line)}.tabs button.active{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{font-size:30px;font-weight:900}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.item{border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.badge{display:inline-block;background:#edf5f1;color:var(--g);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.small{font-size:12px;color:var(--muted)}.media-preview{max-width:100%;max-height:180px;border-radius:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:110px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.two{grid-template-columns:1fr}.tabs{top:70px}}
#loginCard{max-width:520px;margin:40px auto}.who{background:#eef7f2;border-radius:10px;padding:10px;word-break:break-word}
</style>
</head>
<body>
<header><a href="index.html">تطبيق العميل</a><img src="logo-full.png" alt="Biocare"><a href="team.html">فريق الزيارات</a></header>
<main>
<section id="loginCard" class="card">
<h1>لوحة تحكم بيوكير</h1>
<p class="muted">دخول المدراء المعتمدين فقط.</p>
<input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني">
<input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
<button id="loginBtn">تسجيل الدخول</button>
<p id="loginMsg" class="muted"></p>
</section>
<section id="adminApp" class="hidden">
<div class="card row"><div><strong>لوحة الإدارة المركزية</strong><div id="adminWho" class="small"></div></div><button id="logoutBtn" class="ghost" style="flex:0 0 auto">تسجيل الخروج</button></div>
<div class="tabs" id="tabs">
<button data-tab="dashboard" class="active">الرئيسية</button>
<button data-tab="orders">الطلبات</button>
<button data-tab="staff">الموظفون</button>
<button data-tab="content">الإعلانات والمحتوى</button>
<button data-tab="catalog">التحاليل والباقات</button>
<button data-tab="services">الخدمات والإعدادات</button>
</div>
<div id="panel"></div>
</section>
</main>
<script src="catalog.js?v=9"></script>
<script type="module" src="admin.js?v=1"></script>
</body></html>
